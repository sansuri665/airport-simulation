<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>北京有效客流预测测试</title>
  <link rel="stylesheet" href="./static/css/beijing_potential_passenger_forecast_viewer.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>北京有效客流预测测试</h1>
        <span class="status" id="statusText">loading</span>
      </div>
      <div class="controls">
        <a class="nav-link" href="./beijing_airport_operations_viewer.html">运营面板</a>
        <a class="nav-link" href="./global_gdp_viewer.html">宏观 viewer</a>
        <label class="control">Seed <select id="seedSelect"></select></label>
      </div>
    </header>

    <main>
      <section class="summary-grid" id="summaryGrid" aria-label="预测测试摘要"></section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>预测曲线</h2>
            <small id="asOfLabel">发布年份</small>
          </div>
          <div class="legend" id="forecastLegend"></div>
        </div>
        <div class="panel-body">
          <div class="tool-row">
            <label class="control">发布年份 <input id="asOfRange" type="range" min="0" max="0" value="0" /></label>
            <label class="control">报告 <select id="reportSelect"></select></label>
          </div>
          <div class="chart" id="forecastChart"></div>
        </div>
      </section>

      <section class="panel" style="margin-top: 14px;">
        <div class="panel-head">
          <div>
            <h2>分项预测</h2>
            <small id="componentCaption">五类有效客流结构</small>
          </div>
          <label class="control">目标年 <select id="componentYearSelect"></select></label>
        </div>
        <div class="panel-body">
          <div class="score-card-grid" id="componentGrid"></div>
        </div>
      </section>

      <section class="panel" style="margin-top: 14px;">
        <div class="panel-head">
          <div>
            <h2>当前报告明细</h2>
            <small id="tableCaption">当前 as-of 年份</small>
          </div>
        </div>
        <div class="panel-body">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>目标年</th>
                  <th>审计分</th>
                  <th>生成分</th>
                  <th>方向</th>
                  <th>置信</th>
                  <th>有效预测</th>
                  <th>潜在/供给</th>
                  <th>预测区间</th>
                  <th>真实有效</th>
                  <th>真实潜在/供给</th>
                  <th>瓶颈</th>
                  <th>中值偏差</th>
                  <th>命中</th>
                </tr>
              </thead>
              <tbody id="forecastTable"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <template id="legacyBeijingForecastDataScripts">
  <script src="./output/city_airport_potential_passenger_forecast/china_mainland/beijing_airport_system_potential_passenger_forecast_viewer_data.js"></script>
  </template>
  <script src="./output/current_viewer_manifest.js"></script>
  <script src="./static/js/beijing-forecast/bootstrap.js"></script>
  <script src="./static/js/beijing-forecast/state.js"></script>
  <script src="./static/js/beijing-forecast/page.js"></script>
</body>
</html>
