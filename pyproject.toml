[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airport-simulation-workspace"
version = "0.5.0"
description = "Standard-library airport macro, demand, operations, and dynamic-test simulation workspace"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
airport-sim = "airport_sim.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["airport_sim*", "macro_layers*"]
namespaces = true

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["output", "saves"]

[tool.ruff.lint]
# Start with correctness-only rules. Broader style normalization can be enabled
# after the large simulation modules are split without changing calculation order.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = ["airport_sim", "macro_layers"]
omit = ["output/*", "saves/*"]
