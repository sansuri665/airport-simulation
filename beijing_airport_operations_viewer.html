<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>北京机场运营面板</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b10;
      --surface: #10151d;
      --surface-soft: #0c1118;
      --line: #273244;
      --line-strong: #43536c;
      --ink: #f5f7fb;
      --muted: #94a3b8;
      --blue: #60a5fa;
      --green: #34d399;
      --red: #fb7185;
      --amber: #f59e0b;
      --yellow: #facc15;
      --cyan: #22d3ee;
      --pink: #f472b6;
      --purple: #a78bfa;
      --slate: #64748b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--ink);
    }

    button,
    select,
    input {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 11, 16, 0.95);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: 20px;
      line-height: 1.1;
      letter-spacing: 0;
      white-space: nowrap;
    }

    h2 {
      font-size: 15px;
      letter-spacing: 0;
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control,
    .nav-link {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
      white-space: nowrap;
    }

    .segmented {
      display: inline-flex;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      overflow: hidden;
    }

    .segmented button {
      min-width: 76px;
      padding: 0 11px;
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .segmented button:last-child {
      border-right: 0;
    }

    .segmented button[aria-pressed="true"] {
      background: #e5e7eb;
      color: #0b1120;
    }

    .nav-link:hover {
      border-color: var(--blue);
      color: var(--ink);
    }

    select {
      min-width: 90px;
      border: 0;
      outline: none;
      color: var(--ink);
      background: transparent;
    }

    option {
      color: var(--ink);
      background: var(--surface);
    }

    input[type="range"] {
      width: 190px;
      accent-color: var(--blue);
    }

    main {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px 22px 28px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .stat {
      min-height: 90px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      min-width: 0;
    }

    .stat span {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .stat strong {
      display: block;
      font-size: clamp(20px, 2.4vw, 28px);
      line-height: 1.1;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .stat small {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      line-height: 1.35;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.36fr) minmax(320px, 0.82fr);
      gap: 14px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      min-width: 0;
      overflow: hidden;
    }

    .panel-head {
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-soft);
    }

    .panel-body {
      padding: 14px;
    }

    .chart {
      width: 100%;
      height: 310px;
    }

    .finance-readout {
      display: grid;
      grid-template-columns: minmax(260px, 0.7fr) minmax(0, 1.3fr);
      gap: 12px;
      align-items: stretch;
      margin-top: 12px;
    }

    .chart-tools {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 10px;
    }

    .is-hidden {
      display: none;
    }

    .finance-year-control {
      justify-content: space-between;
    }

    .finance-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .finance-metrics.commercial-breakdown {
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .commercial-section {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .commercial-section + .commercial-section {
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .commercial-section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .commercial-section-head span {
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    .commercial-section-head small {
      color: var(--muted);
      text-align: right;
    }

    .commercial-section-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .finance-metric {
      min-height: 78px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .finance-metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 7px;
    }

    .finance-metric strong {
      display: block;
      font-size: 22px;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .finance-metric small {
      display: block;
      margin-top: 7px;
      color: var(--muted);
    }

    .quarter-chart {
      height: 320px;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
    }

    .series-legend {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .swatch {
      width: 10px;
      height: 10px;
      display: inline-block;
      margin-right: 6px;
      border-radius: 2px;
      vertical-align: -1px;
    }

    .stack {
      display: grid;
      gap: 14px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .detail {
      min-height: 76px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
      min-width: 0;
    }

    .detail span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .detail strong {
      font-size: 19px;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .detail small {
      display: block;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.35;
    }

    .quarter-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .quarter-tile {
      min-height: 116px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--surface-soft);
    }

    .quarter-tile strong {
      display: block;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .quarter-tile span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 700px;
      border-collapse: collapse;
      font-size: 13px;
    }

    .wide-table {
      min-width: 1180px;
    }

    .table-panel {
      margin-top: 14px;
    }

    .asset-detail-panel {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .asset-detail-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .asset-detail-head h3 {
      font-size: 14px;
      letter-spacing: 0;
    }

    .asset-detail-head span {
      color: var(--muted);
      font-size: 12px;
    }

    th,
    td {
      padding: 10px 9px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      background: var(--surface-soft);
    }

    .positive {
      color: var(--green);
    }

    .warning {
      color: var(--amber);
    }

    .danger {
      color: var(--red);
    }

    .muted {
      color: var(--muted);
    }

    .empty {
      padding: 28px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
    }

    svg text {
      font-family: inherit;
      letter-spacing: 0;
    }

    @media (max-width: 1100px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      .topbar {
        position: static;
        grid-template-columns: 1fr;
        align-items: stretch;
      }

      .brand {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
      }

      .controls {
        justify-content: stretch;
      }

      .control,
      .nav-link,
      .segmented,
      input[type="range"],
      select {
        width: 100%;
      }

      .segmented button {
        flex: 1;
      }

      .summary-grid,
      .detail-grid,
      .quarter-strip,
      .finance-readout,
      .finance-metrics,
      .commercial-section-grid {
        grid-template-columns: 1fr;
      }

      main {
        padding: 14px;
      }

      .chart {
        height: 280px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>北京机场运营</h1>
        <span class="status" id="statusText">loading</span>
      </div>
      <div class="controls">
        <a class="nav-link" href="./global_gdp_viewer.html">宏观 viewer</a>
        <a class="nav-link" href="./beijing_potential_passenger_forecast_viewer.html">有效客流预测</a>
        <label class="control">Seed <select id="seedSelect"></select></label>
      </div>
    </header>

    <main>
      <section class="summary-grid" id="summaryGrid" aria-label="北京机场运营摘要"></section>

      <section class="panel">
        <div class="panel-head">
          <h2>年度轨迹</h2>
          <div class="legend">
            <div class="series-legend" id="trajectoryLegend">
              <span><i class="swatch" style="background: var(--blue)"></i>收入</span>
              <span><i class="swatch" style="background: var(--red)"></i>成本</span>
              <span><i class="swatch" style="background: var(--green)"></i>利润</span>
            </div>
            <div class="segmented" id="chartModeSwitch" aria-label="chart mode">
              <button type="button" data-chart-mode="finance" aria-pressed="true">经营损益</button>
              <button type="button" data-chart-mode="passenger" aria-pressed="false">客流容量</button>
              <button type="button" data-chart-mode="valuation" aria-pressed="false">估值曲线</button>
              <button type="button" data-chart-mode="asset" aria-pressed="false">资产折旧</button>
              <button type="button" data-chart-mode="balance" aria-pressed="false">资产负债表</button>
            </div>
            <label class="control">口径 <select id="financeScopeSelect">
              <option value="annual">全年</option>
              <option value="Q1">Q1</option>
              <option value="Q2">Q2</option>
              <option value="Q3">Q3</option>
              <option value="Q4">Q4</option>
            </select></label>
          </div>
        </div>
        <div class="panel-body">
          <div class="chart-tools" id="financeSideTools">
            <div class="segmented" id="financeSideSwitch" aria-label="finance side">
              <button type="button" data-finance-side="total" aria-pressed="true">总览</button>
              <button type="button" data-finance-side="aeronautical" aria-pressed="false">航运侧</button>
              <button type="button" data-finance-side="commercial" aria-pressed="false">商业侧</button>
            </div>
          </div>
          <div class="chart" id="financeChart"></div>
          <div class="finance-readout">
            <label class="control finance-year-control">年份 <input id="financeYearRange" type="range" min="0" max="0" value="0" /></label>
            <div class="finance-metrics" id="financeMetrics"></div>
          </div>
          <div class="asset-detail-panel is-hidden" id="assetDetailPanel">
            <div class="asset-detail-head">
              <h3>槽位资产明细</h3>
              <span id="assetDetailNote"></span>
            </div>
            <div class="table-wrap">
              <table class="wide-table">
                <thead>
                  <tr>
                    <th>槽位</th>
                    <th>规格</th>
                    <th>投用期</th>
                    <th>资产原值</th>
                    <th>残值下限</th>
                    <th>累计折旧</th>
                    <th>账面净值</th>
                    <th>当期折旧</th>
                    <th>剩余折旧</th>
                  </tr>
                </thead>
                <tbody id="assetSlotTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="./output/city_airport_quarterly_operations/china_mainland/beijing_airport_system_quarterly_operations_viewer_data.js"></script>
  <script src="./output/city_airport_financial_state/china_mainland/beijing_airport_system_financial_state_viewer_data.js"></script>
  <script src="./output/city_airport_valuation/china_mainland/beijing_airport_system_valuation_forecast_viewer_data.js"></script>
  <script>
    const rawRows = (window.CITY_AIRPORT_QUARTERLY_OPERATIONS_DATA?.rows || []).map((row) => ({ ...row }));
    const rawFinancialRows = (window.CITY_AIRPORT_FINANCIAL_STATE_DATA?.rows || []).map((row) => ({ ...row }));
    const rawValuationRows = (window.CITY_AIRPORT_VALUATION_FORECAST_DATA?.rows || []).map((row) => ({ ...row }));
    const el = {
      statusText: document.getElementById("statusText"),
      seedSelect: document.getElementById("seedSelect"),
      chartModeSwitch: document.getElementById("chartModeSwitch"),
      financeSideTools: document.getElementById("financeSideTools"),
      financeSideSwitch: document.getElementById("financeSideSwitch"),
      trajectoryLegend: document.getElementById("trajectoryLegend"),
      financeScopeSelect: document.getElementById("financeScopeSelect"),
      financeYearRange: document.getElementById("financeYearRange"),
      summaryGrid: document.getElementById("summaryGrid"),
      financeChart: document.getElementById("financeChart"),
      financeMetrics: document.getElementById("financeMetrics"),
      assetDetailPanel: document.getElementById("assetDetailPanel"),
      assetDetailNote: document.getElementById("assetDetailNote"),
      assetSlotTable: document.getElementById("assetSlotTable"),
    };

    const SLOT_ASSETS = [
      {
        airportName: "北京首都",
        slotName: "首都T3航站楼",
        facilitySize: "extra_large",
        inServiceYear: 2008,
        assetOriginalMillionCny: 51000,
        usefulLifeYears: 40,
        residualValuePct: 10,
      },
      {
        airportName: "北京首都",
        slotName: "首都T2航站楼",
        facilitySize: "large",
        inServiceYear: 2000,
        assetOriginalMillionCny: 28500,
        usefulLifeYears: 35,
        residualValuePct: 10,
      },
      {
        airportName: "北京首都",
        slotName: "首都玩家扩建槽位 1",
        facilitySize: "empty",
        inServiceYear: null,
        assetOriginalMillionCny: 0,
        usefulLifeYears: 0,
        residualValuePct: 0,
      },
      {
        airportName: "北京首都",
        slotName: "首都玩家扩建槽位 2",
        facilitySize: "empty",
        inServiceYear: null,
        assetOriginalMillionCny: 0,
        usefulLifeYears: 0,
        residualValuePct: 0,
      },
      {
        airportName: "北京首都",
        slotName: "首都玩家扩建槽位 3",
        facilitySize: "empty",
        inServiceYear: null,
        assetOriginalMillionCny: 0,
        usefulLifeYears: 0,
        residualValuePct: 0,
      },
      {
        airportName: "北京大兴",
        slotName: "大兴T1航站楼",
        facilitySize: "giant",
        inServiceYear: 2019,
        assetOriginalMillionCny: 78750,
        usefulLifeYears: 45,
        residualValuePct: 10,
      },
      {
        airportName: "北京大兴",
        slotName: "大兴T2航站楼",
        facilitySize: "empty",
        inServiceYear: null,
        assetOriginalMillionCny: 0,
        usefulLifeYears: 0,
        residualValuePct: 0,
      },
      {
        airportName: "北京大兴",
        slotName: "大兴玩家扩建槽位 1",
        facilitySize: "empty",
        inServiceYear: null,
        assetOriginalMillionCny: 0,
        usefulLifeYears: 0,
        residualValuePct: 0,
      },
      {
        airportName: "北京大兴",
        slotName: "大兴玩家扩建槽位 2",
        facilitySize: "empty",
        inServiceYear: null,
        assetOriginalMillionCny: 0,
        usefulLifeYears: 0,
        residualValuePct: 0,
      },
      {
        airportName: "北京大兴",
        slotName: "大兴玩家扩建槽位 3",
        facilitySize: "empty",
        inServiceYear: null,
        assetOriginalMillionCny: 0,
        usefulLifeYears: 0,
        residualValuePct: 0,
      },
    ];

    const configuredInitialAssets = (window.CITY_AIRPORT_FINANCIAL_STATE_DATA?.initial_assets || []).map((asset) => ({
      airportName: asset.airport_name || asset.airport_id || "-",
      slotName: asset.slot_name || asset.slot_id || asset.asset_id || "-",
      facilitySize: asset.facility_size || "-",
      inServiceYear: num(asset.in_service_year, null),
      assetOriginalMillionCny: num(asset.asset_original_million_cny),
      usefulLifeYears: num(asset.useful_life_years),
      residualValuePct: num(asset.residual_value_pct),
    }));
    if (configuredInitialAssets.length) {
      SLOT_ASSETS.splice(0, SLOT_ASSETS.length, ...configuredInitialAssets);
    }
    const configuredGeneralLoans = (window.CITY_AIRPORT_FINANCIAL_STATE_DATA?.general_loans || []).map((loan) => ({
      id: loan.loan_id || "",
      name: loan.loan_name || loan.loan_id || "",
      style: loan.repayment_style || "",
    }));
    const loanNameMap = new Map(configuredGeneralLoans.map((loan) => [loan.id, loan.name]));

    const state = {
      seed: null,
      chartMode: "finance",
      financeSide: "total",
      financeScope: "annual",
      selectedYear: null,
    };

    const PASSENGER_COMPONENTS = [
      { key: "business", label: "商务" },
      { key: "leisure", label: "休闲" },
      { key: "vfr", label: "探亲访友" },
      { key: "long_haul", label: "长途" },
      { key: "transfer", label: "中转" },
    ];

    function num(value, fallback = 0) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : fallback;
    }

    function fmtBillion(millionCny) {
      return `${(num(millionCny) / 100).toFixed(1)} 亿元`;
    }

    function fmtPassenger(million) {
      const value = num(million);
      if (value >= 100) return `${(value / 100).toFixed(3)} 亿`;
      return `${(value * 100).toFixed(0)} 万`;
    }

    function fmtPassengerShort(million) {
      const value = num(million);
      if (value >= 100) return `${(value / 100).toFixed(3)}亿`;
      return `${(value * 100).toFixed(0)}万`;
    }

    function fmtPct(value) {
      return `${num(value).toFixed(1)}%`;
    }

    function fmtBps(value) {
      return `${num(value).toFixed(0)} bps`;
    }

    function uniqueSemiList(value) {
      const parts = String(value || "").split(";").map((part) => part.trim()).filter(Boolean);
      return [...new Set(parts)];
    }

    function loanIdsLabel(value) {
      const ids = uniqueSemiList(value);
      if (!ids.length) return "无";
      return ids.map((id) => loanNameMap.get(id) || id).join(" / ");
    }

    function fmtMultiplier(value) {
      return `${num(value, 1).toFixed(3)}x`;
    }

    function fmtValuationMultiple(value) {
      const parsed = Number(value);
      if (!Number.isFinite(parsed) || Math.abs(parsed) <= 1e-9) return "-";
      return `${parsed.toFixed(2)}x`;
    }

    function fmtCny(value) {
      return `${num(value).toFixed(1)} 元/客`;
    }

    function fmtYears(value) {
      return `${num(value).toFixed(1)} 年`;
    }

    function contractBasisLabel(value) {
      if (value === "minimum_guarantee") return "保底生效";
      if (value === "revenue_share") return "分成生效";
      if (value === "mixed") return "混合生效";
      return value || "-";
    }

    function contractStatusLabel(value) {
      if (value === "startup_history_fixed") return "开局历史合同";
      if (value === "auto_forecast_renewal") return "自动预测重签";
      if (value === "fixed_contract") return "固定合同";
      return value || "-";
    }

    function gamePhaseLabel(value) {
      if (value === "startup_operating_history") return "开局历史";
      if (value === "player_operation") return "玩家经营";
      return value || "-";
    }

    function toneClass(value, warningAt, dangerAt) {
      const v = num(value);
      if (v >= dangerAt) return "danger";
      if (v >= warningAt) return "warning";
      return "positive";
    }

    function groupAnnual(rows) {
      const grouped = new Map();
      rows.forEach((row) => {
        const year = num(row.year);
        if (!grouped.has(year)) grouped.set(year, []);
        grouped.get(year).push(row);
      });

      return [...grouped.entries()].sort((a, b) => a[0] - b[0]).map(([year, items]) => {
        items.sort((a, b) => num(String(a.quarter).replace("Q", ""), 1) - num(String(b.quarter).replace("Q", ""), 1));
        const first = items[0];
        const quarters = Object.fromEntries(items.map((row) => [row.quarter, row]));
        const revenue = items.reduce((sum, row) => sum + num(row.total_operating_revenue_million_cny), 0);
        const cost = items.reduce((sum, row) => sum + num(row.total_operating_cost_million_cny), 0);
        const profit = items.reduce((sum, row) => sum + num(row.quarter_operating_profit_million_cny), 0);
        const commercial = items.reduce((sum, row) => sum + num(row.commercial_revenue_million_cny), 0);
        const foodRetail = items.reduce((sum, row) => sum + num(row.food_retail_revenue_million_cny), 0);
        const dutyFreeContract = items.reduce((sum, row) => sum + num(row.duty_free_revenue_million_cny), 0);
        const luxuryContract = items.reduce((sum, row) => sum + num(row.luxury_retail_revenue_million_cny), 0);
        const contractCommercial = items.reduce(
          (sum, row) => sum + num(
            row.contract_commercial_revenue_million_cny,
            num(row.duty_free_revenue_million_cny) + num(row.luxury_retail_revenue_million_cny)
          ),
          0
        );
        const foodRetailFixedCost = items.reduce(
          (sum, row) => sum + num(row.food_retail_fixed_operating_cost_million_cny),
          0
        );
        const foodRetailPassengerCost = items.reduce(
          (sum, row) => sum + num(row.food_retail_passenger_service_cost_million_cny),
          0
        );
        const foodRetailSalesCost = items.reduce(
          (sum, row) => sum + num(row.food_retail_sales_cost_million_cny),
          0
        );
        const foodRetailOperatingCost = items.reduce(
          (sum, row) => sum + num(
            row.food_retail_operating_cost_million_cny,
            num(row.food_retail_sales_cost_million_cny) +
            num(row.food_retail_fixed_operating_cost_million_cny) +
              num(row.food_retail_passenger_service_cost_million_cny)
          ),
          0
        );
        const foodRetailProfit = items.reduce(
          (sum, row) => sum + num(
            row.food_retail_operating_profit_million_cny,
            num(row.food_retail_revenue_million_cny) -
              num(row.food_retail_operating_cost_million_cny)
          ),
          0
        );
        const dutyFreeWeightedPassengers = items.reduce(
          (sum, row) => sum + num(row.duty_free_weighted_passengers_million),
          0
        );
        const dutyFreeSales = items.reduce((sum, row) => sum + num(row.duty_free_sales_million_cny), 0);
        const dutyFreeGuarantee = items.reduce(
          (sum, row) => sum + num(row.duty_free_contract_minimum_guarantee_million_cny),
          0
        );
        const dutyFreeShareRevenue = items.reduce(
          (sum, row) => sum + num(row.duty_free_contract_share_revenue_million_cny),
          0
        );
        const dutyFreeForecastSales = num(first.duty_free_contract_forecast_annual_sales_million_cny);
        const dutyFreeBasisSet = new Set(items.map((row) => row.duty_free_contract_revenue_basis || ""));
        const luxuryWeightedPassengers = items.reduce(
          (sum, row) => sum + num(row.luxury_weighted_passengers_million),
          0
        );
        const luxurySales = items.reduce((sum, row) => sum + num(row.luxury_sales_million_cny), 0);
        const luxuryGuarantee = items.reduce(
          (sum, row) => sum + num(row.luxury_contract_minimum_guarantee_million_cny),
          0
        );
        const luxuryShareRevenue = items.reduce(
          (sum, row) => sum + num(row.luxury_contract_share_revenue_million_cny),
          0
        );
        const luxuryForecastSales = num(first.luxury_contract_forecast_annual_sales_million_cny);
        const luxuryBasisSet = new Set(items.map((row) => row.luxury_contract_revenue_basis || ""));
        const commercialDirectCost = items.reduce(
          (sum, row) => sum + num(row.commercial_direct_cost_million_cny),
          0
        );
        const commercialProfit = items.reduce(
          (sum, row) => sum + num(
            row.commercial_operating_profit_million_cny,
            num(row.commercial_revenue_million_cny) - num(row.commercial_direct_cost_million_cny)
          ),
          0
        );
        const aero = items.reduce((sum, row) => sum + num(row.aeronautical_revenue_million_cny), 0);
        const fixedCost = items.reduce((sum, row) => sum + num(row.quarter_slot_fixed_operating_cost_million_cny), 0);
        const passengerCost = items.reduce(
          (sum, row) => sum + num(row.quarter_passenger_variable_cost_million_cny),
          0
        );
        const congestion = items.reduce((sum, row) => sum + num(row.quarter_congestion_cost_million_cny), 0);
        const potentialPassengers = items.reduce(
          (sum, row) => sum + num(row.quarter_city_potential_passengers_million),
          0
        );
        const airlineSupply = items.reduce(
          (sum, row) => sum + num(row.quarter_airline_supply_passengers_million),
          0
        );
        const passengers = items.reduce((sum, row) => sum + num(row.quarter_served_passengers_million), 0);
        const designCapacity = items.reduce((sum, row) => sum + num(row.quarter_design_capacity_million), 0);
        const maxCapacity = items.reduce((sum, row) => sum + num(row.quarter_max_capacity_million), 0);
        const airlineSupplyFulfillment = potentialPassengers ? Math.min(100, airlineSupply / potentialPassengers * 100) : 100;
        const airlineSupplyGap = Math.max(0, potentialPassengers - airlineSupply);
        const passengerComponents = PASSENGER_COMPONENTS.map((component) => {
          const potential = items.reduce(
            (sum, row) => sum + num(
              row[`${component.key}_quarter_potential_passengers_million`],
              num(row[`${component.key}_quarter_served_passengers_million`])
            ),
            0
          );
          const supplyFallback = potentialPassengers ? airlineSupply * potential / potentialPassengers : potential;
          const supply = items.reduce(
            (sum, row) => sum + num(
              row[`${component.key}_quarter_airline_supply_passengers_million`],
              supplyFallback / items.length
            ),
            0
          );
          const served = items.reduce(
            (sum, row) => sum + num(row[`${component.key}_quarter_served_passengers_million`]),
            0
          );
          return { ...component, potential, airlineSupply: supply, passengers: served };
        });
        const renovationPeriodDepreciation = items.reduce(
          (sum, row) => sum + num(row.renovation_asset_period_depreciation_million_cny),
          0
        );
        const latestRenovationAsset = items[items.length - 1] || first;
        const constructionPeriodDepreciation = items.reduce(
          (sum, row) => sum + num(row.construction_asset_period_depreciation_million_cny),
          0
        );
        const latestConstructionAsset = items[items.length - 1] || first;
        const rebuildPeriodDepreciation = items.reduce(
          (sum, row) => sum + num(row.rebuild_asset_period_depreciation_million_cny),
          0
        );
        const latestRebuildAsset = items[items.length - 1] || first;
        const qualityWeight = items.reduce((sum, row) => sum + num(row.quarter_served_passengers_million), 0);
        const weightedQuarterAverage = (field, fallback = 0) => {
          if (!qualityWeight) return fallback;
          return items.reduce(
            (sum, row) => sum + num(row[field], fallback) * num(row.quarter_served_passengers_million),
            0
          ) / qualityWeight;
        };
        const qualityIndex = weightedQuarterAverage("city_airport_perceived_quality_index", 100);
        const qualitySizeScore = weightedQuarterAverage("perceived_quality_size_score", 0);
        const qualityAgeScore = weightedQuarterAverage("perceived_quality_age_score", 0);
        const qualityCapacityScore = weightedQuarterAverage("perceived_quality_capacity_score", 0);
        const qualityDisruptionScore = weightedQuarterAverage("perceived_quality_construction_disruption_score", 0);
        const foodRetailQualityMultiplier = weightedQuarterAverage(
          "food_retail_perceived_quality_revenue_multiplier",
          1
        );
        const dutyFreeQualityMultiplier = weightedQuarterAverage(
          "duty_free_perceived_quality_sales_multiplier",
          1
        );
        const luxuryQualityMultiplier = weightedQuarterAverage(
          "luxury_perceived_quality_sales_multiplier",
          1
        );
        return {
          year,
          seed: num(first.seed),
          potentialPassengers: potentialPassengers || num(first.annual_city_potential_passengers_million, num(first.annual_served_passengers_million)),
          airlineSupply: airlineSupply || num(first.annual_city_airline_supply_passengers_million, num(first.annual_city_potential_passengers_million, num(first.annual_served_passengers_million))),
          airlineSupplyIndex: num(first.annual_city_airline_supply_index, 100),
          airlineSupplyFulfillment,
          airlineSupplyGap,
          airlineSupplyVolatilityRegime: first.annual_city_airline_supply_volatility_regime || "normal_airline_supply_cycle",
          passengerComponents,
          passengers,
          designCapacity,
          maxCapacity,
          revenue,
          cost,
          profit,
          commercial,
          foodRetail,
          dutyFreeContract,
          luxuryContract,
          contractCommercial,
          foodRetailFixedCost,
          foodRetailPassengerCost,
          foodRetailSalesCost,
          foodRetailOperatingCost,
          foodRetailProfit,
          dutyFreeWeightedPassengers,
          dutyFreeSales,
          dutyFreeGuarantee,
          dutyFreeShareRevenue,
          dutyFreeForecastSales,
          dutyFreeContractBasis: dutyFreeBasisSet.size === 1 ? [...dutyFreeBasisSet][0] : "mixed",
          dutyFreeContractCycle: first.duty_free_contract_cycle_id || "-",
          dutyFreeContractStatus: first.duty_free_contract_status || "-",
          gamePhase: first.game_phase || "-",
          playerDecisionEnabled: num(first.player_decision_enabled),
          luxuryWeightedPassengers,
          luxurySales,
          luxuryGuarantee,
          luxuryShareRevenue,
          luxuryForecastSales,
          luxuryContractBasis: luxuryBasisSet.size === 1 ? [...luxuryBasisSet][0] : "mixed",
          luxuryContractCycle: first.luxury_contract_cycle_id || "-",
          luxuryContractStatus: first.luxury_contract_status || "-",
          commercialDirectCost,
          commercialProfit,
          aero,
          fixedCost,
          passengerCost,
          congestion,
          renovationActiveEventIds: [...new Set(items.map((row) => row.renovation_active_event_ids || "").filter(Boolean))].join(";"),
          renovationCompletedEventIds: [...new Set(items.map((row) => row.renovation_completed_event_ids || "").filter(Boolean))].join(";"),
          renovationAssetInServicePeriods: latestRenovationAsset.renovation_asset_in_service_periods || "",
          renovationCapexOutlay: items.reduce((sum, row) => sum + num(row.renovation_quarter_capex_outlay_million_cny), 0),
          renovationConstructionInProgress: Math.max(...items.map((row) => num(row.renovation_construction_in_progress_million_cny))),
          renovationAssetOriginal: num(latestRenovationAsset.renovation_asset_original_million_cny),
          renovationAssetResidualFloor: num(latestRenovationAsset.renovation_asset_residual_floor_million_cny),
          renovationAssetAccumulatedDepreciation: num(latestRenovationAsset.renovation_asset_accumulated_depreciation_million_cny),
          renovationAssetBookValue: num(latestRenovationAsset.renovation_asset_book_value_million_cny),
          renovationAssetPeriodDepreciation: renovationPeriodDepreciation,
          constructionActiveEventIds: [...new Set(items.map((row) => row.construction_active_event_ids || "").filter(Boolean))].join(";"),
          constructionCompletedEventIds: [...new Set(items.map((row) => row.construction_completed_event_ids || "").filter(Boolean))].join(";"),
          constructionAssetInServicePeriods: latestConstructionAsset.construction_asset_in_service_periods || "",
          constructionCapexOutlay: items.reduce((sum, row) => sum + num(row.construction_quarter_capex_outlay_million_cny), 0),
          constructionInProgress: Math.max(...items.map((row) => num(row.construction_in_progress_million_cny))),
          constructionAssetOriginal: num(latestConstructionAsset.construction_asset_original_million_cny),
          constructionAssetResidualFloor: num(latestConstructionAsset.construction_asset_residual_floor_million_cny),
          constructionAssetAccumulatedDepreciation: num(latestConstructionAsset.construction_asset_accumulated_depreciation_million_cny),
          constructionAssetBookValue: num(latestConstructionAsset.construction_asset_book_value_million_cny),
          constructionAssetPeriodDepreciation: constructionPeriodDepreciation,
          rebuildActiveEventIds: [...new Set(items.map((row) => row.rebuild_active_event_ids || "").filter(Boolean))].join(";"),
          rebuildStartedEventIds: [...new Set(items.map((row) => row.rebuild_started_event_ids || "").filter(Boolean))].join(";"),
          rebuildStartedSlotIds: [...new Set(items.map((row) => row.rebuild_started_slot_ids || "").filter(Boolean))].join(";"),
          rebuildCompletedEventIds: [...new Set(items.map((row) => row.rebuild_completed_event_ids || "").filter(Boolean))].join(";"),
          rebuildAssetInServicePeriods: latestRebuildAsset.rebuild_asset_in_service_periods || "",
          rebuildCapexOutlay: items.reduce((sum, row) => sum + num(row.rebuild_quarter_capex_outlay_million_cny), 0),
          rebuildDemolitionExpense: items.reduce((sum, row) => sum + num(row.rebuild_quarter_demolition_expense_million_cny), 0),
          rebuildOldRenovationAssetWriteoff: items.reduce((sum, row) => sum + num(row.rebuild_old_renovation_asset_writeoff_million_cny), 0),
          rebuildConstructionInProgress: Math.max(...items.map((row) => num(row.rebuild_construction_in_progress_million_cny))),
          rebuildAssetOriginal: num(latestRebuildAsset.rebuild_asset_original_million_cny),
          rebuildAssetResidualFloor: num(latestRebuildAsset.rebuild_asset_residual_floor_million_cny),
          rebuildAssetAccumulatedDepreciation: num(latestRebuildAsset.rebuild_asset_accumulated_depreciation_million_cny),
          rebuildAssetBookValue: num(latestRebuildAsset.rebuild_asset_book_value_million_cny),
          rebuildAssetPeriodDepreciation: rebuildPeriodDepreciation,
          qualityIndex,
          qualitySizeScore,
          qualityAgeScore,
          qualityCapacityScore,
          qualityDisruptionScore,
          foodRetailQualityMultiplier,
          dutyFreeQualityMultiplier,
          luxuryQualityMultiplier,
          quarters,
          margin: revenue ? profit / revenue * 100 : 0,
          maxQuarterDesignUtilization: Math.max(...items.map((row) => num(row.quarter_design_utilization_pct))),
          maxQuarterMaxUtilization: Math.max(...items.map((row) => num(row.quarter_max_utilization_pct))),
          maxQuarterCrowding: Math.max(...items.map((row) => num(row.quarter_crowding_index))),
          bottleneck: first.annual_city_binding_bottleneck || "-",
          branch: first.branch_scenario_id || "none",
          branchState: first.branch_scenario_state || "baseline",
        };
      });
    }

    function rowsForSeed() {
      return rawRows.filter((row) => num(row.seed) === state.seed);
    }

    function financialRowsForSeed() {
      return rawFinancialRows.filter((row) => num(row.seed) === state.seed);
    }

    function valuationRowsForSeed() {
      return rawValuationRows.filter((row) => num(row.seed) === state.seed);
    }

    function valuationScopeQuarter() {
      return state.financeScope === "annual" ? "Q4" : state.financeScope;
    }

    function valuationRowsForYear(year) {
      return valuationRowsForSeed()
        .filter((row) => num(row.as_of_year) === num(year))
        .sort((a, b) => (
          num(String(a.as_of_quarter).replace("Q", ""), 1) -
          num(String(b.as_of_quarter).replace("Q", ""), 1)
        ));
    }

    function valuationRowForYear(year) {
      const rows = valuationRowsForYear(year);
      if (!rows.length) return null;
      const quarter = valuationScopeQuarter();
      const exact = rows.find((row) => row.as_of_quarter === quarter);
      if (exact) return exact;
      return state.financeScope === "annual" ? rows[rows.length - 1] : null;
    }

    function valuationValues(row) {
      const valuation = valuationRowForYear(row.year);
      return {
        row: valuation,
        asOfYear: valuation ? num(valuation.as_of_year) : row.year,
        asOfQuarter: valuation?.as_of_quarter || valuationScopeQuarter(),
        valuationPrimaryMethod: valuation?.valuation_primary_method || "net_asset_value",
        netAssetEquityValue: num(
          valuation?.net_asset_equity_value_million_cny,
          num(valuation?.primary_equity_value_million_cny, num(valuation?.equity_value_million_cny))
        ),
        netAssetEnterpriseValue: num(
          valuation?.net_asset_enterprise_value_million_cny,
          num(valuation?.primary_enterprise_value_million_cny, num(valuation?.enterprise_value_million_cny))
        ),
        operatingEnterpriseValue: num(
          valuation?.experimental_operating_enterprise_value_million_cny,
          num(
            valuation?.operating_enterprise_value_million_cny,
            num(valuation?.enterprise_value_million_cny)
          )
        ),
        marketEnterpriseValue: num(
          valuation?.experimental_market_enterprise_value_million_cny,
          num(
            valuation?.market_enterprise_value_million_cny,
            num(valuation?.enterprise_value_million_cny)
          )
        ),
        experimentalEquityValue: num(
          valuation?.experimental_equity_value_million_cny,
          num(valuation?.enterprise_value_million_cny)
        ),
        equityValue: num(
          valuation?.primary_equity_value_million_cny,
          num(valuation?.net_asset_equity_value_million_cny, num(valuation?.equity_value_million_cny))
        ),
        enterpriseValue: num(
          valuation?.primary_enterprise_value_million_cny,
          num(
            valuation?.net_asset_enterprise_value_million_cny,
            num(valuation?.enterprise_value_million_cny)
          )
        ),
        conservativeEquityValue: num(valuation?.equity_value_conservative_million_cny),
        optimisticEquityValue: num(valuation?.equity_value_optimistic_million_cny),
        netDebt: num(valuation?.net_debt_million_cny),
        recognizedCash: num(valuation?.recognized_cash_million_cny),
        totalDebt: num(valuation?.current_total_debt_million_cny),
        currentOperatingProfit: num(valuation?.current_annual_operating_profit_million_cny),
        currentAccountingProfit: num(valuation?.current_annual_accounting_profit_million_cny),
        operatingDiscountRatePct: num(valuation?.operating_discount_rate_pct, num(valuation?.discount_rate_pct)),
        operatingTerminalGrowthPct: num(valuation?.operating_terminal_growth_pct, num(valuation?.terminal_growth_pct)),
        marketMultiplier: num(valuation?.market_valuation_multiplier, 1),
        marketAdjustmentPct: num(valuation?.market_valuation_adjustment_pct),
        marketAdjustment: num(valuation?.market_valuation_adjustment_million_cny),
        marketRateAdjustmentPct: num(valuation?.market_rate_adjustment_pct),
        marketCreditAdjustmentPct: num(valuation?.market_credit_adjustment_pct),
        marketEquityValuationPe: num(
          valuation?.market_equity_valuation_pe,
          num(valuation?.input_equity_valuation_pe, 17)
        ),
        marketEquityValuationAdjustmentPct: num(valuation?.market_equity_valuation_adjustment_pct),
        marketEquitySentimentAdjustmentPct: num(valuation?.market_equity_sentiment_adjustment_pct),
        marketBranchAdjustmentPct: num(valuation?.market_branch_adjustment_pct),
        forecastFcffSum: num(valuation?.forecast_5y_fcff_sum_million_cny),
        operatingNormalizedFcffSum: num(
          valuation?.operating_5y_normalized_fcff_sum_million_cny,
          num(valuation?.forecast_5y_fcff_sum_million_cny)
        ),
        normalizedTerminalFcff: num(valuation?.normalized_terminal_fcff_million_cny),
        forecastYear1Fcff: num(valuation?.forecast_year_1_fcff_million_cny),
        operatingEvToOperatingProfit: num(valuation?.operating_ev_to_current_operating_profit_multiple),
        marketEvToOperatingProfit: num(
          valuation?.market_ev_to_current_operating_profit_multiple,
          num(valuation?.ev_to_current_operating_profit_multiple)
        ),
        priceToOperatingProfit: num(valuation?.price_to_current_operating_profit_multiple),
        priceToAccountingProfit: num(valuation?.price_to_current_accounting_profit_multiple),
        priceToBook: num(
          valuation?.price_to_book_equity_multiple,
          num(valuation?.equity_to_book_equity_multiple)
        ),
        equityToBook: num(valuation?.equity_to_book_equity_multiple),
        uncertaintyRangePct: num(valuation?.valuation_uncertainty_range_pct),
        riskTags: valuation?.valuation_risk_tags || "normal",
      };
    }

    function valuationRiskLabel(value) {
      const labels = {
        normal: "正常",
        capacity_pressure: "容量压力",
        loan_stress_active: "贷款压力",
        branch_event_active: "分岔事件",
        market_discount: "市场折价",
        market_premium: "市场溢价",
        elevated_leverage: "杠杆偏高",
        high_leverage: "高杠杆",
        negative_equity_value: "股权价值为负",
        negative_terminal_fcff: "终值现金流为负",
      };
      const tags = uniqueSemiList(value);
      if (!tags.length) return labels.normal;
      return tags.map((tag) => labels[tag] || tag.replaceAll("_", " ")).join(" / ");
    }

    function bottleneckLabel(value) {
      const labels = {
        demand_limited: "需求不足",
        airline_bottleneck: "航司供给",
        airport_bottleneck: "机场容量",
        dual_airline_airport_bottleneck: "航司 + 机场",
      };
      return labels[value] || value || "-";
    }

    function airlineSupplyVolatilityLabel(value) {
      const labels = {
        normal_airline_supply_cycle: "正常周期",
        volatile_airline_supply: "波动偏强",
        highly_volatile_airline_supply: "剧烈波动",
      };
      return labels[value] || value || "-";
    }

    function annualRows() {
      return groupAnnual(rowsForSeed());
    }

    function chartRowsForMode(data) {
      if (state.chartMode !== "valuation") return data;
      return data.filter((row) => valuationRowForYear(row.year));
    }

    function financialAnnualRows() {
      const grouped = new Map();
      financialRowsForSeed().forEach((row) => {
        const year = num(row.year);
        if (!grouped.has(year)) grouped.set(year, []);
        grouped.get(year).push(row);
      });

      return [...grouped.entries()].sort((a, b) => a[0] - b[0]).map(([year, items]) => {
        items.sort((a, b) => num(String(a.quarter).replace("Q", ""), 1) - num(String(b.quarter).replace("Q", ""), 1));
        const first = items[0];
        const latest = items[items.length - 1];
        const quarters = Object.fromEntries(items.map((row) => [row.quarter, row]));
        const operatingProfit = items.reduce((sum, row) => sum + num(row.period_operating_profit_million_cny), 0);
        const depreciation = items.reduce((sum, row) => sum + num(row.period_accounting_depreciation_million_cny), 0);
        const pretaxAccountingProfit = items.reduce((sum, row) => sum + num(row.period_pretax_accounting_profit_million_cny), 0);

        const hasAnnualTaxSettlement = items.some((row) => row.period_annual_income_tax_payable_million_cny !== undefined && row.period_annual_income_tax_payable_million_cny !== "");
        const taxPrepayment = items.reduce((sum, row) => sum + num(row.period_income_tax_prepayment_million_cny), 0);
        const taxSettlement = items.reduce((sum, row) => sum + num(row.period_income_tax_settlement_million_cny), 0);
        const cashTaxPaid = items.reduce((sum, row) => sum + num(row.period_cash_tax_paid_million_cny), 0);
        const taxLossUsed = items.reduce((sum, row) => sum + num(row.period_tax_loss_used_million_cny), 0);
        const taxLossGenerated = items.reduce((sum, row) => sum + num(row.period_tax_loss_generated_million_cny), 0);
        const taxLossExpired = items.reduce((sum, row) => sum + num(row.period_tax_loss_expired_million_cny), 0);
        const taxLossCarryforwardEnding = num(latest.period_tax_loss_carryforward_ending_million_cny);
        const taxableIncome = hasAnnualTaxSettlement ? taxableIncomeAfterLoss : taxableIncomeBeforeLoss;
        const incomeTax = items.reduce((sum, row) => sum + num(row.period_income_tax_expense_million_cny), 0);
        const accountingProfit = items.reduce((sum, row) => sum + num(row.period_accounting_profit_million_cny), 0);

        const rebuildCapex = items.reduce((sum, row) => sum + num(row.period_rebuild_capex_outlay_million_cny), 0);

        const rebuildInitialWriteoff = items.reduce(
          (sum, row) => sum + num(row.period_rebuild_old_initial_asset_writeoff_million_cny),

        );
        const rebuildRenovationWriteoff = items.reduce(
          (sum, row) => sum + num(row.period_rebuild_old_renovation_asset_writeoff_million_cny),
          0
        );
        const rebuildOldAssetWriteoff = items.reduce(
          (sum, row) => sum + num(row.period_rebuild_old_asset_writeoff_million_cny),

        );
        const freeCashFlow = items.reduce((sum, row) => sum + num(row.period_free_cash_flow_before_financing_million_cny), 0);
        const interestExpense = items.reduce((sum, row) => sum + num(row.period_interest_expense_million_cny), 0);
        const loanDrawdown = items.reduce((sum, row) => sum + num(row.period_loan_drawdown_million_cny), 0);

        const principalRepayment = items.reduce((sum, row) => sum + num(row.period_principal_repayment_million_cny), 0);
        const debtService = items.reduce((sum, row) => sum + num(row.period_debt_service_million_cny), 0);
        const financingCashFlow = items.reduce((sum, row) => sum + num(row.period_financing_cash_flow_million_cny), 0);
        const debtRateWeight = items.reduce(
          (sum, row) => sum + (num(row.short_term_debt_million_cny) + num(row.long_term_debt_million_cny)) * num(row.loan_weighted_interest_rate_pct),

        );
        const debtRateBase = items.reduce(
          (sum, row) => sum + num(row.short_term_debt_million_cny) + num(row.long_term_debt_million_cny),

        const drawdownLeverageBefore = Math.max(...items.map((row) => num(row.loan_drawdown_leverage_before_pct)));

        );
        const drawdownRateWeight = items.reduce(
          (sum, row) => sum + num(row.period_loan_drawdown_million_cny) * num(row.loan_drawdown_weighted_interest_rate_pct),

        );
        const loanActiveIds = uniqueSemiList(items.map((row) => row.loan_active_ids || "").join(";")).join(";");

    function makeStat(label, value, sub = "", className = "") {

        makeStat("首年客流", fmtPassenger(first.passengers), `${first.year}`),

      return row.quarters[quarter] || {};

    function aeronauticalValues(row) {
      if (state.financeScope === "annual") {
        const totalCost = row.fixedCost + row.passengerCost + row.congestion;
        return {
          revenue: row.aero,
          fixedCost: row.fixedCost,
          passengerCost: row.passengerCost,
          congestionCost: row.congestion,
          totalCost,
          result: row.aero - totalCost,
        };
      }
      const quarter = q(row, state.financeScope);
      const revenue = num(quarter.aeronautical_revenue_million_cny);
      const fixedCost = num(quarter.quarter_slot_fixed_operating_cost_million_cny);
      const passengerCost = num(quarter.quarter_passenger_variable_cost_million_cny);
      const congestionCost = num(quarter.quarter_congestion_cost_million_cny);
      const totalCost = fixedCost + passengerCost + congestionCost;
      return {
        revenue,
        fixedCost,
        passengerCost,
        congestionCost,
        totalCost,
        result: revenue - totalCost,

        directCost,

    function financeValue(row, key) {
      if (state.financeSide === "aeronautical") {
        const values = aeronauticalValues(row);
        if (key === "revenue") return values.revenue;
        if (key === "fixedCost") return values.fixedCost;
        if (key === "passengerCost") return values.passengerCost;
        if (key === "congestionCost") return values.congestionCost;
        if (key === "cost") return values.totalCost;
        return values.result;
      }
      if (state.financeSide === "commercial") {
        const values = commercialValues(row);
        if (key === "selfRevenue") return values.selfRevenue;
        if (key === "dutyFreeRevenue") return values.dutyFreeRevenue;
        if (key === "luxuryRevenue") return values.luxuryRevenue;
        if (key === "contractRevenue") return values.contractRevenue;
        if (key === "fixedCost") return values.fixedCost;
        if (key === "passengerServiceCost") return values.passengerServiceCost;
        if (key === "salesCost") return values.salesCost;
        if (key === "cost") return values.directCost;
        if (key === "revenue") return values.totalRevenue;
        return values.result;
      }
      if (state.financeScope === "annual") {
        if (key === "revenue") return row.revenue;
        if (key === "cost") return row.cost;
        return row.profit;
      }
      const quarter = q(row, state.financeScope);
      if (key === "revenue") return num(quarter.total_operating_revenue_million_cny);
      if (key === "cost") return num(quarter.total_operating_cost_million_cny);
      return num(quarter.quarter_operating_profit_million_cny);
    }

      return state.financeScope === "annual" ? "全年" : state.financeScope;
    }

    function selectedQuarterNumber() {
      if (state.financeScope === "annual") return 4;
      return num(String(state.financeScope).replace("Q", ""), 1);
    }

    function operatingProfitValue(row) {
      if (state.financeScope === "annual") return row.profit;
      return num(q(row, state.financeScope).quarter_operating_profit_million_cny);
    }

    function slotAssetValue(asset, year) {
      const original = num(asset.assetOriginalMillionCny);
      const usefulLife = num(asset.usefulLifeYears);
      if (!original || !usefulLife || !asset.inServiceYear) {
        return {
          ...asset,
          residualFloor: 0,
          annualDepreciation: 0,
          periodDepreciation: 0,
          accumulatedDepreciation: 0,
          bookValue: 0,
          remainingLifeYears: 0,
        };
      }
      const residualFloor = original * num(asset.residualValuePct) / 100;
      const annualDepreciation = (original - residualFloor) / usefulLife;
      const elapsedBeforeYear = Math.min(Math.max(year - asset.inServiceYear, 0), usefulLife);
      const depreciatesThisYear = year >= asset.inServiceYear && year < asset.inServiceYear + usefulLife;
      const quarterNumber = selectedQuarterNumber();
      const elapsedAtPeriodEnd = state.financeScope === "annual"
        ? Math.min(elapsedBeforeYear + (depreciatesThisYear ? 1 : 0), usefulLife)
        : Math.min(elapsedBeforeYear + (depreciatesThisYear ? quarterNumber / 4 : 0), usefulLife);
      const periodDepreciation = depreciatesThisYear
        ? annualDepreciation * (state.financeScope === "annual" ? 1 : 0.25)
        : 0;
      const accumulatedDepreciation = annualDepreciation * elapsedAtPeriodEnd;
      const bookValue = Math.max(original - accumulatedDepreciation, residualFloor);
      return {
        ...asset,
        residualFloor,
        annualDepreciation,
        periodDepreciation,
        accumulatedDepreciation,
        bookValue,
        remainingLifeYears: Math.max(usefulLife - elapsedAtPeriodEnd, 0),
      };
    }

    function assetSlotsForYear(year) {
      return SLOT_ASSETS.map((asset) => slotAssetValue(asset, year));
    }

        : num(source.renovation_asset_original_million_cny);
      const residualFloor = state.financeScope === "annual"
        ? num(row.renovationAssetResidualFloor)

        : num(source.renovation_asset_accumulated_depreciation_million_cny);

        ? num(row.renovationAssetBookValue)

      const periodDepreciation = state.financeScope === "annual"
        ? num(row.renovationAssetPeriodDepreciation)
        : num(source.renovation_asset_period_depreciation_million_cny);
      const constructionInProgress = state.financeScope === "annual"
        ? num(row.renovationConstructionInProgress)

      const activeIds = state.financeScope === "annual"
        ? row.renovationActiveEventIds
        : source.renovation_active_event_ids;
      const completedIds = state.financeScope === "annual"
        ? row.renovationCompletedEventIds
        : source.renovation_completed_event_ids;
      const inServicePeriods = state.financeScope === "annual"
        ? row.renovationAssetInServicePeriods
        : source.renovation_asset_in_service_periods;
      if (!original && !bookValue && !constructionInProgress && !activeIds && !completedIds) {
        return null;

      if (!original && constructionInProgress) {
        return {
          airportName: "北京首都",

          facilitySize: "large renovation",

          residualFloor: 0,
          accumulatedDepreciation: 0,
          bookValue: constructionInProgress,
          periodDepreciation: 0,
          remainingLifeYears: "-",

      return {
        airportName: "北京首都",
        slotName: "首都T2航站楼翻新资产",
        facilitySize: "large renovation",
        inServiceYear: String(inServicePeriods || "-").split(";")[0],
        assetOriginalMillionCny: original,
        residualFloor,
        accumulatedDepreciation,
        bookValue,
        periodDepreciation,
        remainingLifeYears: "-",
      };
    }

    function constructionAssetSlot(row) {

      const original = state.financeScope === "annual"

      const accumulatedDepreciation = state.financeScope === "annual"

    function rebuildAssetSlot(row) {
      const source = state.financeScope === "annual" ? row : q(row, state.financeScope);

    function hasPekSlot2RebuildStarted(row) {
      const source = state.financeScope === "annual" ? row : q(row, state.financeScope);
      const ids = state.financeScope === "annual"
        ? `${row.rebuildActiveEventIds || ""};${row.rebuildStartedEventIds || ""};${row.rebuildCompletedEventIds || ""}`
        : `${source.rebuild_active_event_ids || ""};${source.rebuild_started_event_ids || ""};${source.rebuild_completed_event_ids || ""}`;
      return ids.includes("PEK_SLOT_2_REBUILD_2056Q1");
    }

    function assetSlotsForRow(row) {
      const baseSlots = assetSlotsForYear(row.year).filter((slot) => (
        !hasPekSlot2RebuildStarted(row) || !String(slot.slotName || "").includes("首都T2航站楼")
      ));
      const renovationSlot = renovationAssetSlot(row);
      const constructionSlot = constructionAssetSlot(row);
      const rebuildSlot = rebuildAssetSlot(row);
      return [
        ...baseSlots,
        ...(renovationSlot ? [renovationSlot] : []),
        ...(constructionSlot ? [constructionSlot] : []),
        ...(rebuildSlot ? [rebuildSlot] : []),
      ];
    }

    function assetValues(row) {
      const slots = assetSlotsForRow(row);
      const financial = balanceValues(row);
      if (
        financial.fixedAssetOriginal ||
        financial.fixedAssetBook ||
        financial.fixedAssetAccumulatedDepreciation ||
        financial.fixedAssetResidualFloor
      ) {
        return {
          original: financial.fixedAssetOriginal,
          residualFloor: financial.fixedAssetResidualFloor,
          accumulatedDepreciation: financial.fixedAssetAccumulatedDepreciation,
          bookValue: financial.fixedAssetBook,
          periodDepreciation: financial.depreciation,
          accountingProfit: financial.accountingProfit,
          slots,
        };
      }
      const totals = slots.reduce(
        (sum, slot) => ({
          original: sum.original + slot.assetOriginalMillionCny,
          residualFloor: sum.residualFloor + slot.residualFloor,
          accumulatedDepreciation: sum.accumulatedDepreciation + slot.accumulatedDepreciation,
          bookValue: sum.bookValue + slot.bookValue,
          periodDepreciation: sum.periodDepreciation + slot.periodDepreciation,
        }),
        { original: 0, residualFloor: 0, accumulatedDepreciation: 0, bookValue: 0, periodDepreciation: 0 }
      );
      return {
        ...totals,
        accountingProfit: operatingProfitValue(row) - totals.periodDepreciation,
        slots,

        const supplyFallback = potentialPassengers ? airlineSupply * potential / potentialPassengers : potential;
        return {

          passengers: num(quarter[`${component.key}_quarter_served_passengers_million`]),

    function renderTrajectoryChart(data) {
      if (!data.length) {
        el.financeChart.innerHTML = `<div class="empty">No data</div>`;
        return;
      }
      const width = 980;
      const height = 330;
      const margin = { top: 20, right: 28, bottom: 38, left: 62 };
      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;
      const series = trajectorySeries();
      renderTrajectoryLegend(series);
      const minYear = Math.min(...data.map((row) => row.year));
      const maxYear = Math.max(...data.map((row) => row.year));
      const values = data.flatMap((row) => series.map((item) => item.value(row)));
      const maxY = Math.max(...values, 1) * 1.08;
      const minY = Math.min(0, Math.min(...values));
      const spanY = maxY - minY || 1;
      const x = (year) => margin.left + (maxYear === minYear ? 0 : (year - minYear) / (maxYear - minYear) * plotW);
      const y = (value) => margin.top + (maxY - value) / spanY * plotH;
      const selected = data.find((row) => row.year === state.selectedYear) || data[0];
      const selectedX = x(selected.year);
      const axisFormat = state.chartMode === "passenger"
        ? (value) => value.toFixed(value >= 1 ? 1 : 2)
        : (value) => value.toFixed(0);
      const gridValues = [0, 0.25, 0.5, 0.75, 1].map((part) => minY + spanY * part);
      const grid = gridValues.map((value) => {
        const gy = y(value);
        return `<line x1="${margin.left}" y1="${gy.toFixed(2)}" x2="${width - margin.right}" y2="${gy.toFixed(2)}" stroke="#223044" /><text x="${margin.left - 10}" y="${(gy + 4).toFixed(2)}" text-anchor="end" font-size="11" fill="#94a3b8">${axisFormat(value)}</text>`;
      }).join("");
      const lines = series.map((item) => {
        const points = data.map((row) => [x(row.year), y(item.value(row))]);
        const dotY = y(item.value(selected));
        return `
          <path d="${pathFromPoints(points)}" fill="none" stroke="${item.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="${selectedX.toFixed(2)}" cy="${dotY.toFixed(2)}" r="4.5" fill="${item.color}" stroke="#080b10" stroke-width="2" />
        `;
      }).join("");
      const yearTicks = [minYear, Math.round((minYear + maxYear) / 2), maxYear];
      const ticks = [...new Set(yearTicks)].map((year) => `<text x="${x(year).toFixed(2)}" y="${height - 12}" text-anchor="middle" font-size="11" fill="#94a3b8">${year}</text>`).join("");
      const scopeLabel = financeScopeLabel();
      const unitLabel = state.chartMode === "passenger" ? "亿人次" : "亿元";
      const chartName = state.chartMode === "passenger"
        ? "客流容量图"
        : state.chartMode === "valuation"
          ? "估值曲线"
        : state.chartMode === "asset"
          ? "资产折旧图"
          : state.chartMode === "balance"
            ? "资产负债表"
            : financeLabels().chartName;

      el.financeChart.innerHTML = `
        <svg viewBox="0 0 ${width} ${height}" width="100%" height="100%" role="img" aria-label="北京机场${scopeLabel}${chartName}">
          <rect x="0" y="0" width="${width}" height="${height}" fill="transparent"></rect>
          ${grid}
          <line x1="${margin.left}" y1="${height - margin.bottom}" x2="${width - margin.right}" y2="${height - margin.bottom}" stroke="#43536c" />
          <line x1="${selectedX.toFixed(2)}" y1="${margin.top}" x2="${selectedX.toFixed(2)}" y2="${height - margin.bottom}" stroke="#64748b" stroke-dasharray="4 6" />
          ${lines}
          ${ticks}
          <text x="${selectedX.toFixed(2)}" y="${margin.top - 6}" text-anchor="middle" font-size="11" fill="#bfdbfe">${selected.year}</text>
          <text x="${width - margin.right}" y="16" text-anchor="end" font-size="12" fill="#94a3b8">${scopeLabel} / ${unitLabel}</text>
        </svg>
      `;
    }

    function metricCard(label, value, small, className = "") {
      const strongClass = className ? ` class="${className}"` : "";
      return `<article class="finance-metric"><span>${label}</span><strong${strongClass}>${value}</strong><small>${small}</small></article>`;
    }

    function commercialSection(title, subtitle, cards) {
      return `
        <section class="commercial-section">
          <div class="commercial-section-head"><span>${title}</span><small>${subtitle}</small></div>
          <div class="commercial-section-grid">${cards.join("")}</div>
        </section>
      `;
    }

      const statementValues = balanceValues(selected);
      el.financeMetrics.innerHTML = [
        `<article class="finance-metric"><span>${selected.year} ${scopeLabel}${labels.revenue}</span><strong>${fmtBillion(revenue)}</strong><small>${labels.revenueSmall}</small></article>`,
        `<article class="finance-metric"><span>${selected.year} ${scopeLabel}${labels.cost}</span><strong>${fmtBillion(cost)}</strong><small>${labels.costSmall}</small></article>`,
        `<article class="finance-metric"><span>${selected.year} ${scopeLabel}${labels.profit}</span><strong class="${profitClass(profit)}">${fmtBillion(profit)}</strong><small>${labels.profitSmall}</small></article>`,
        `<article class="finance-metric"><span>${selected.year} ${scopeLabel}税前利润</span><strong class="${profitClass(statementValues.pretaxAccountingProfit)}">${fmtBillion(statementValues.pretaxAccountingProfit)}</strong><small>经营结果 - 折旧 - 拆除费 - 核销 - 利息</small></article>`,
        `<article class="finance-metric"><span>${selected.year} ${scopeLabel}所得税</span><strong>${fmtBillion(statementValues.incomeTax)}</strong><small>应税利润 ${fmtBillion(statementValues.taxableIncome)} / 有效税率 ${fmtPct(statementValues.effectiveTaxRatePct)}</small></article>`,
        `<article class="finance-metric"><span>${selected.year} ${scopeLabel}税务汇算</span><strong>${fmtBillion(statementValues.taxSettlement)}</strong><small>预缴 ${fmtBillion(statementValues.taxPrepayment)} / 亏损抵扣 ${fmtBillion(statementValues.taxLossUsed)} / 结转 ${fmtBillion(statementValues.taxLossCarryforwardEnding)}</small></article>`,
        `<article class="finance-metric"><span>${selected.year} ${scopeLabel}${state.financeScope === "annual" ? "税后会计利润" : "当季税后利润"}</span><strong class="${profitClass(statementValues.accountingProfit)}">${fmtBillion(statementValues.accountingProfit)}</strong><small>税前利润 - 所得税</small></article>`,
        `<article class="finance-metric"><span>${selected.year} ${scopeLabel}${state.financeScope === "annual" ? "自由现金流" : "当季自由现金流"}</span><strong class="${profitClass(statementValues.freeCashFlow)}">${fmtBillion(statementValues.freeCashFlow)}</strong><small>经营利润 - capex - 拆除费 - 所得税</small></article>`,
      ].join("");
    }

    function renderAssetSlotDetails(data) {
      const selected = data.find((row) => row.year === state.selectedYear) || data[0];
      if (state.chartMode !== "asset") {
        el.assetDetailPanel.classList.add("is-hidden");
        el.assetSlotTable.innerHTML = "";
        return;
      }
      const scopeLabel = financeScopeLabel();
      const slots = assetSlotsForRow(selected);
      el.assetDetailPanel.classList.remove("is-hidden");
      el.assetDetailNote.textContent = `${selected.year} ${scopeLabel}，金额单位：亿元`;
      el.assetSlotTable.innerHTML = slots.map((slot) => {
        const slotLabel = `${slot.airportName} ${slot.slotName}`;
        const statusClass = slot.assetOriginalMillionCny ? (slot.remainingLifeYears > 0 ? "" : "muted") : "muted";
        const remaining = typeof slot.remainingLifeYears === "number" ? fmtYears(slot.remainingLifeYears) : "-";
        return `
          <tr>
            <td>${slotLabel}</td>
            <td>${slot.facilitySize}</td>
            <td>${slot.inServiceYear || "-"}</td>
            <td>${fmtBillion(slot.assetOriginalMillionCny)}</td>
            <td>${fmtBillion(slot.residualFloor)}</td>
            <td>${fmtBillion(slot.accumulatedDepreciation)}</td>
            <td class="${statusClass}">${fmtBillion(slot.bookValue)}</td>
            <td>${fmtBillion(slot.periodDepreciation)}</td>
            <td>${remaining}</td>
          </tr>
        `;
      }).join("");
    }

    function render() {
      const fullData = annualRows();
      if (!fullData.length) {
        document.querySelector("main").innerHTML = `<div class="empty">No data loaded</div>`;
        return;
      }
      const data = chartRowsForMode(fullData);
      if (!data.length) {
        const emptyLabel = state.chartMode === "valuation" ? "没有可用估值数据" : "没有可用图表数据";
        el.financeChart.innerHTML = `<div class="empty">${emptyLabel}</div>`;
        el.financeMetrics.innerHTML = "";
        el.assetDetailPanel.classList.add("is-hidden");
        return;
      }
      const years = data.map((row) => row.year);
      if (!years.includes(state.selectedYear)) {
        state.selectedYear = years[0];
      }
      el.financeYearRange.min = String(years[0]);
      el.financeYearRange.max = String(years[years.length - 1]);
      el.financeYearRange.value = String(state.selectedYear);
      updateChartModeButtons();
      renderSummary(fullData);
      renderTrajectoryChart(data);
      renderTrajectoryMetrics(data);
      renderAssetSlotDetails(data);
      el.statusText.textContent = `北京数据：${fullData.length} 年，${rowsForSeed().length} 个季度`;
    }

    function init() {
      const seeds = [...new Set(rawRows.map((row) => num(row.seed)))].sort((a, b) => a - b);
      if (!rawRows.length || !seeds.length) {
        document.querySelector("main").innerHTML = `<div class="empty">No quarterly operations data found</div>`;
        el.statusText.textContent = "no data";
        return;
      }
      state.seed = seeds[0];
      el.seedSelect.innerHTML = seeds.map((seed) => `<option value="${seed}">seed ${seed}</option>`).join("");
      state.selectedYear = Math.min(...rawRows.filter((row) => num(row.seed) === state.seed).map((row) => num(row.year)));

      el.seedSelect.addEventListener("change", () => {
        state.seed = num(el.seedSelect.value);
        const seedYears = rawRows.filter((row) => num(row.seed) === state.seed).map((row) => num(row.year));
        state.selectedYear = Math.min(...seedYears);
        render();
      });
      el.financeScopeSelect.addEventListener("change", () => {
        state.financeScope = el.financeScopeSelect.value;
        render();
      });
      el.chartModeSwitch.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          state.chartMode = button.dataset.chartMode;
          render();
        });
      });
      el.financeSideSwitch.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          state.financeSide = button.dataset.financeSide;
          render();
        });
      });
      el.financeYearRange.addEventListener("input", () => {
        const data = chartRowsForMode(annualRows());
        if (!data.length) return;
        const target = num(el.financeYearRange.value);
        state.selectedYear = data.reduce(
          (closest, row) => Math.abs(row.year - target) < Math.abs(closest - target) ? row.year : closest,
          data[0].year
        );
        render();
      });

      render();
    }

    init();
  </script>
</body>
</html>
