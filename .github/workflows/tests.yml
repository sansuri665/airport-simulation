name: airport-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace in editable mode
        run: python -m pip install -e . --no-deps
      - name: Check Python syntax
        run: python -m compileall -q airport_sim airport_ui macro_layers dynamic_tests tests
      - name: Check Markdown local links
        run: python tools/check_markdown_links.py
      - name: Check browser JavaScript syntax
        run: python tools/check_javascript_syntax.py
      - name: Validate configuration contracts
        run: python -m airport_sim validate-config
      - name: Smoke unified entrypoints
        run: |
          python -m airport_sim --help
          airport-sim --help
      - name: Run regression and contract tests
        run: python -m unittest discover -s tests -v
      - name: Check whitespace errors
        run: git diff --check
