<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>北京高速站点</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div><h1>北京高速站点</h1></div>
      </div>
      <nav class="research-switcher" aria-label="预研页面">
        <a class="research-tab" href="./railway.html">铁路线路</a>
        <a class="research-tab active" href="./beijing-stations.html" aria-current="page">北京站点</a>
      </nav>
      <div class="top-actions">
        <span class="status-pill"><i></i><span>本地静态数据</span></span>
        <button class="control-button" id="resetButton" type="button">重置视图</button>
        <button class="zoom-button" id="zoomOutButton" type="button" aria-label="缩小">−</button>
        <button class="zoom-button" id="zoomInButton" type="button" aria-label="放大">＋</button>
      </div>
    </header>

    <main class="workspace">
      <section class="map-card" aria-label="北京高速铁路站点地图">
        <div class="map-stage" id="mapStage" tabindex="0">
          <svg id="mapSvg" viewBox="0 0 1200 760" role="img" aria-label="北京高速铁路站点图">
            <defs>
              <pattern id="microGrid" width="24" height="24" patternUnits="userSpaceOnUse">
                <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#18232c" stroke-width="1"></path>
              </pattern>
              <filter id="glow" x="-200%" y="-200%" width="400%" height="400%">
                <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
                <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
              </filter>
            </defs>
            <rect class="map-background" x="0" y="0" width="1200" height="760"></rect>
            <rect class="micro-grid" x="0" y="0" width="1200" height="760"></rect>
            <g id="viewport">
              <g id="gridLayer"></g>
              <g id="railwayLayer"></g>
            </g>
          </svg>
          <div class="map-title-overlay">北京站点</div>
          <div class="map-hint">滚轮缩放　·　拖动平移　·　W A S D 移动</div>
          <div class="map-legend" aria-label="站点图例">
            <span><i class="legend-swatch station"></i>高速站点</span>
          </div>
          <div class="zoom-readout" id="zoomReadout">100%</div>
        </div>
        <div class="map-footer">
          <span>铁路预研 · 北京高速铁路站点 · 坐标为参考值</span>
          <span>北京</span>
        </div>
      </section>

      <aside class="sidebar">
        <section class="side-section search-section">
          <div class="section-heading">
            <div>
              <p class="eyebrow">STATION INDEX</p>
              <h2>北京站点</h2>
            </div>
            <span class="count-badge" id="stationCount">0</span>
          </div>
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="搜索车站" autocomplete="off">
          </label>
          <p class="search-note railway-note" id="stationNote">当前显示北京高速铁路站点。</p>
        </section>

        <section class="airport-list railway-list" id="stationList" aria-label="北京高速铁路站点列表"></section>
      </aside>
    </main>

    <footer class="page-footer">铁路预研独立于 Airport 主项目数据链路。</footer>
  </div>
  <script src="./railways.js"></script>
  <script src="./beijing-stations.js"></script>
</body>
</html>
