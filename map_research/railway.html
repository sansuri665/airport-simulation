<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10191e">
  <title>铁路网络 · 地图研究</title>
  <link rel="stylesheet" href="./style.css?v=20261017-economy">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./railway.html" aria-label="铁路网络首页">
      <svg class="brand-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M10 5v16m12-16v16M10 10h12M10 17h12M7 28l5-7h8l5 7M10 25h12"/></svg>
      <span><span class="brand-name">铁路网络</span><span class="brand-caption">RAIL ATLAS / 地图研究</span></span>
    </a>
    <div class="topbar-actions"><div class="network-stats" aria-label="网络概览">
      <span><strong id="totalConnections">—</strong> 条连接</span>
      <span><strong id="totalStations">—</strong> 个站点</span>
      <span class="data-status"><i></i>本地预研数据</span>
    </div><a id="economyLink" class="page-link economy-link" href="./economy.html">经济环境 ↗</a></div>
  </header>

  <main class="workspace">
    <aside class="explorer" aria-label="网络浏览器">
      <div class="explorer-header">
        <div class="section-title"><span class="eyebrow">EXPLORE THE NETWORK</span><span class="edition">2026.10</span></div>
        <h1>浏览铁路分局管辖网</h1>
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
          <input id="searchInput" type="search" placeholder="搜索分局或所属站点" aria-label="搜索分局或所属站点" autocomplete="off">
        </div>
        <div class="type-filter" role="group" aria-label="连接类型">
          <button type="button" data-type="all" aria-pressed="true">全部</button>
          <button type="button" data-type="high_speed" aria-pressed="false"><i class="swatch high-speed"></i>高速</button>
          <button type="button" data-type="conventional" aria-pressed="false"><i class="swatch conventional"></i>普速</button>
        </div>
      </div>
      <div class="list-toolbar">
        <span class="list-heading">铁路分局</span>
        <span id="entryCount" class="result-count" aria-live="polite">—</span>
      </div>
      <div id="entryList" class="entry-list" aria-label="铁路分局列表"></div>
      <div class="explorer-footer"><span id="pageNote">选择分局，查看管辖网</span><span>↗</span></div>
    </aside>

    <section class="map-card" aria-label="铁路网络地图">
      <div class="map-stage" id="mapStage" tabindex="0" aria-label="铁路地图，滚轮缩放，拖动或方向键平移">
        <svg id="mapSvg" role="img" aria-label="铁路网络经纬度示意图">
          <defs><pattern id="microGrid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.65" fill="#72878d" opacity="0.20"/></pattern></defs>
          <rect width="100%" height="100%" fill="url(#microGrid)"/>
          <g id="viewport"><g id="gridLayer"></g><g id="routeLayer"></g><g id="divisionLayer"></g><g id="hitLayer"></g><g id="stationLayer"></g></g>
        </svg>
        <div class="map-heading"><span class="eyebrow">RAILWAY NETWORK</span><h2 id="mapTitle">泛中国铁路网络</h2><p id="mapSummary"></p></div>
        <div class="north-marker" aria-hidden="true"><span>N</span><svg viewBox="0 0 20 30"><path d="M10 2 17 24 10 20 3 24Z"/></svg></div>
        <div class="map-controls" role="group" aria-label="地图控制">
          <button id="fitButton" type="button" title="适配当前网络" aria-label="适配当前网络">⛶</button>
          <span class="control-divider"></span>
          <button id="zoomInButton" type="button" aria-label="放大">＋</button>
          <output id="zoomReadout">100%</output>
          <button id="zoomOutButton" type="button" aria-label="缩小">−</button>
          <span class="control-divider"></span>
          <button id="labelButton" type="button" aria-pressed="true" title="显示站名">站名</button>
        </div>
        <div class="map-legend"><span><i class="swatch high-speed"></i>高速</span><span><i class="swatch conventional"></i>普速</span></div>
        <div class="map-hint">滚轮缩放 · 拖动平移 · 点击连接查看</div>
      </div>
      <div class="map-footer"><span>经纬度示意 / 坐标仅供研究</span><span id="selectionReadout" aria-live="polite">全网视图</span><button id="resetButton" type="button">重置视图 ↺</button></div>
      <section id="divisionPanel" class="detail-panel division-panel" hidden aria-label="铁路分局概览">
        <div class="detail-heading"><div><span class="eyebrow">分局概览 / DIVISION</span><h2 id="divisionTitle"></h2></div><button id="closeDivision" type="button" aria-label="关闭分局概览">×</button></div>
        <div id="divisionBody" class="detail-body division-body"></div>
      </section>
      <section id="detailPanel" class="detail-panel" hidden aria-label="站点或连接详情">
        <div class="detail-heading"><div><span id="detailKind" class="eyebrow"></span><h2 id="detailTitle"></h2></div><button id="closeDetail" type="button" aria-label="关闭详情">×</button></div>
        <p id="detailMeta" class="detail-meta"></p>
        <div id="detailBody" class="detail-body"></div>
      </section>
    </section>
  </main>
  <script src="./railway-data.js?v=20261013-taiwan-station-names"></script>
  <script src="./railway-divisions.js?v=20261013-investment-open-80"></script>
  <script src="./railway.js?v=20261017-economy"></script>
</body>
</html>
