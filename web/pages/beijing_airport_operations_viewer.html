<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>北京机场运营面板</title>
  <link rel="stylesheet" href="/static/css/beijing_airport_operations_viewer.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>北京机场运营</h1>
        <span class="status" id="statusText">loading</span>
      </div>
      <div class="controls">
        <a class="nav-link" href="/global-gdp">宏观 viewer</a>
        <a class="nav-link" href="/beijing-forecast">有效客流预测</a>
        <label class="control">Seed <select id="seedSelect"></select></label>
      </div>
    </header>

    <main>
      <section class="summary-grid" id="summaryGrid" aria-label="北京机场运营摘要"></section>

      <section class="panel">
        <div class="panel-head">
          <h2>年度轨迹</h2>
          <div class="legend">
            <div class="series-legend" id="trajectoryLegend">
              <span><i class="swatch" style="background: var(--blue)"></i>收入</span>
              <span><i class="swatch" style="background: var(--red)"></i>成本</span>
              <span><i class="swatch" style="background: var(--green)"></i>利润</span>
            </div>
            <div class="segmented" id="chartModeSwitch" aria-label="chart mode">
              <button type="button" data-chart-mode="finance" aria-pressed="true">经营损益</button>
              <button type="button" data-chart-mode="passenger" aria-pressed="false">客流容量</button>
              <button type="button" data-chart-mode="valuation" aria-pressed="false">估值曲线</button>
              <button type="button" data-chart-mode="asset" aria-pressed="false">资产折旧</button>
              <button type="button" data-chart-mode="balance" aria-pressed="false">资产负债表</button>
            </div>
            <label class="control">口径 <select id="financeScopeSelect">
              <option value="annual">全年</option>
              <option value="Q1">Q1</option>
              <option value="Q2">Q2</option>
              <option value="Q3">Q3</option>
              <option value="Q4">Q4</option>
            </select></label>
          </div>
        </div>
        <div class="panel-body">
          <div class="chart-tools" id="financeSideTools">
            <div class="segmented" id="financeSideSwitch" aria-label="finance side">
              <button type="button" data-finance-side="total" aria-pressed="true">总览</button>
              <button type="button" data-finance-side="aeronautical" aria-pressed="false">航运侧</button>
              <button type="button" data-finance-side="commercial" aria-pressed="false">商业侧</button>
            </div>
          </div>
          <div class="chart" id="financeChart"></div>
          <div class="finance-readout">
            <label class="control finance-year-control">年份 <input id="financeYearRange" type="range" min="0" max="0" value="0" /></label>
            <div class="finance-metrics" id="financeMetrics"></div>
          </div>
          <div class="asset-detail-panel is-hidden" id="assetDetailPanel">
            <div class="asset-detail-head">
              <h3>槽位资产明细</h3>
              <span id="assetDetailNote"></span>
            </div>
            <div class="table-wrap">
              <table class="wide-table">
                <thead>
                  <tr>
                    <th>槽位</th>
                    <th>规格</th>
                    <th>投用期</th>
                    <th>资产原值</th>
                    <th>残值下限</th>
                    <th>累计折旧</th>
                    <th>账面净值</th>
                    <th>当期折旧</th>
                    <th>剩余折旧</th>
                  </tr>
                </thead>
                <tbody id="assetSlotTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <template id="legacyBeijingOperationsDataScripts">
  <script src="./output/city_airport_quarterly_operations/china_mainland/beijing_airport_system_quarterly_operations_viewer_data.js"></script>
  <script src="./output/city_airport_financial_state/china_mainland/beijing_airport_system_financial_state_viewer_data.js"></script>
  <script src="./output/city_airport_valuation/china_mainland/beijing_airport_system_valuation_forecast_viewer_data.js"></script>
  </template>
  <script src="./output/current_viewer_manifest.js"></script>
  <script src="/static/js/beijing-operations/bootstrap.js"></script>
  <script src="/static/js/beijing-operations/state.js"></script>
  <script src="/static/js/beijing-operations/data-client.js"></script>
  <script src="/static/js/beijing-operations/renderers.js"></script>
  <script src="/static/js/beijing-operations/page.js"></script>
</body>
</html>
